printf '%s' "$res"
'''
shell = ["bash", "--noprofile", "--norc"]
format = "[](fg:#3d59a1 bg:#292e42)[ $output ](fg:#e0af68 bg:#292e42)[ ](fg:#292e42)"

# not in a git repo: just close the directory segment
[custom.git_none]
when = '[ "$(git rev-parse --is-inside-work-tree 2>/dev/null)" != true ]'
shell = ["bash", "--noprofile", "--norc"]
format = "[ ](fg:#3d59a1)"

[nodejs]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[bun]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[rust]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[golang]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[php]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#1d2230"
format = '[[  $time ](fg:#a0a9cb bg:#1d2230)]($style)'

[os]
style = "bg:#a3aed2 fg:#090c0c"
format = "[ $symbol ]($style)"
disabled = false

